<style>

*{box-sizing:border-box}[hidden]{display:none!important}

.tt{min-width:0}.tt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tt small{color:var(--mute)}

.nx{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.nx h3{margin:2px 0}
.row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.row select,.fm input,.fm select,.fm textarea{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:9px 11px}
.fr{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;padding:14px 16px}.g1{flex:1;min-width:0}.mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.stp{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px}.acts{display:flex}
.foot,.cx{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dh{text-align:center;color:var(--mute);font-size:12px;font-weight:700}
.mg button{aspect-ratio:1/.85;border:1px solid var(--ln);background:var(--pn);border-radius:14px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-weight:700}.mg small{font-size:10px;opacity:.8}.mg .out{opacity:.45}.mg .tdy{border-color:var(--ac)}.mg .on{background:var(--ac);color:#fff;border-color:var(--ac);opacity:1}
dialog{border:0;border-radius:26px;padding:24px;width:min(500px,94vw);background:var(--sf);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4)}dialog::backdrop{background:rgba(20,18,60,.5);backdrop-filter:blur(3px)}
.fm{display:grid;gap:12px}.fm h3{font-size:20px}.fm label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--mute)}.fm input,.fm select,.fm textarea{width:100%;color:var(--ink);background:var(--pn)}.r2,.r3{display:grid;gap:10px;grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}.fa{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--nv);color:var(--nvt);padding:11px 16px;border-radius:14px;display:none;gap:14px;align-items:center;z-index:50;max-width:92vw}.toast.on{display:flex}.toast button{background:none;border:0;color:var(--ac2);font-weight:800}
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:40}.gc{padding:32px;width:100%;max-width:400px;display:grid;gap:14px;justify-items:center;text-align:center}.gc h3{font-size:26px}.gc .row{width:100%;flex-wrap:nowrap}.gc .row input{flex:1;min-width:0;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px}
@media(max-width:1040px){.s3,.s4{grid-column:span 6}.s5,.s6,.s7{grid-column:span 12}}
@media(max-width:720px){body{padding:0}.shell{border-radius:0;grid-template-columns:1fr}.side{display:none}.main{padding:18px 14px 30px}.s3,.s4,.s6{grid-column:span 12}.tk{grid-template-columns:24px 1fr auto}.tk .pg,.tk .pc{display:none}.st3{gap:10px}.sc{min-height:120px;padding:12px}.sc b{font-size:28px}h1{font-size:28px}.srch{order:9;max-width:none;flex-basis:100%}.hide{display:none}}
</style>

<script>
const CATS=["Work","Personal","Health","Finance","Learning","Errands"],KEY="taskboard.v2",FIREBASE_CONFIG=window.FIREBASE_CONFIG||null;

const KL={task:"Task",assignment:"Assignment",event:"Event"},PN=["","Low","Medium","High"],PC=["","lo","md","hi"],mmss=ms=>pad(Math.floor(ms/60000))+":"+pad(Math.floor(ms/1000)%60);

document.addEventListener("keydown",e=>{if(e.target.id==="qa"&&e.key==="Enter")return G.qa();
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)||e.metaKey||e.ctrlKey||$("dlg").open||!U)return;
  if(e.key==="n"){e.preventDefault();openDlg(null)}if(e.key==="/"){e.preventDefault();$("q").focus()}});
$("q").oninput=e=>{S.q=e.target.value.trim().toLowerCase();if(S.q&&S.view!=="tasks"){S.view="tasks";S.f="all"}render()};
$("df").onsubmit=e=>{e.preventDefault();saveDlg()};$("dcx").onclick=()=>$("dlg").close();
$("ddel").onclick=()=>{const t=S.tasks.find(x=>x.id===S.edit);$("dlg").close();if(t)A.rm(t)};
$("undo").onclick=()=>{if(last){S.tasks.splice(last.i,0,last.t);last=null;commit();$("toast").classList.remove("on")}};
$("f-cat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),a=Array.isArray(d)?d:d.tasks;if(!Array.isArray(a))throw 0;
  const tm=x=>/^\d\d:\d\d$/.test(x||"")?x:"",ok=a.filter(t=>t&&typeof t.title==="string").map(t=>mk({title:t.title.slice(0,200),kind:KL[t.kind]?t.kind:"task",pri:[1,2,3].includes(+t.pri)?+t.pri:2,cat:CATS.includes(t.cat)?t.cat:"Personal",due:/^\d{4}-\d\d-\d\d$/.test(t.due||"")?t.due:"",st:tm(t.st),en:tm(t.en),done:!!t.done,rep:["daily","weekly","monthly"].includes(t.rep)?t.rep:"",sub:Array.isArray(t.sub)?t.sub.filter(x=>x&&typeof x.t==="string").map(x=>({id:uid(),t:x.t.slice(0,120),d:!!x.d})):[]}));
  S.tasks=ok.concat(S.tasks);commit();toast("Imported "+ok.length+" items")}catch(x){toast("That file isn't a valid Taskboard export")}};r.readAsText(f);e.target.value=""};

/* ---------- accounts + Firebase ---------- */
async function initFirebase(){if(!FIREBASE_CONFIG)return false;const b="https://www.gstatic.com/firebasejs/10.12.2/";
  const [A,Au,Fs]=await Promise.all([import(b+"firebase-app.js"),import(b+"firebase-auth.js"),import(b+"firebase-firestore.js")]);
  const app=A.initializeApp(FIREBASE_CONFIG);FB={auth:Au.getAuth(app),db:Fs.getFirestore(app),Au,Fs};return true}
function googleBtn(){const b=document.createElement("button");b.className="btn p";b.textContent="Continue with Google";
  b.onclick=async()=>{try{await FB.Au.signInWithPopup(FB.auth,new FB.Au.GoogleAuthProvider())}catch(e){toast("Google sign-in failed. Try again.")}};$("gbtn").appendChild(b)}
function startSync(){if(!FB||!U||!U.id.startsWith("g:"))return;ref=FB.Fs.doc(FB.db,"users",U.id.slice(2));$("msync").textContent="Connecting…";
  unsub=FB.Fs.onSnapshot(ref,snap=>{if(snap.metadata.hasPendingWrites)return;const d=snap.data();
    if(snap.exists()&&d&&Array.isArray(d.tasks)){S.tasks=d.tasks;try{localStorage.setItem(tk(),JSON.stringify({tasks:S.tasks}))}catch(e){}if(!$("dlg").open)render()}else push();
    $("msync").textContent="Synced to cloud"},()=>{$("msync").textContent="Cloud sync unavailable"})}
function stopSync(){if(unsub){unsub();unsub=null}clearTimeout(pt);ref=null}
function push(){if(!FB||!unsub||!ref)return;clearTimeout(pt);$("msync").textContent="Saving…";
  pt=setTimeout(()=>FB.Fs.setDoc(ref,{tasks:S.tasks,updated:Date.now()}).then(()=>{$("msync").textContent="Synced to cloud"}).catch(()=>{$("msync").textContent="Cloud sync unavailable"}),600)}
function setUser(u,keep){stopSync();U=u;if(keep){try{localStorage.setItem(KEY+".user",JSON.stringify(u))}catch(e){}}
  $("gate").hidden=true;$("who").innerHTML=U.picture?`<img src="${esc(U.picture)}" alt="" referrerpolicy="no-referrer">`:esc((U.name||"?")[0].toUpperCase());
  $("mname").textContent=U.name;$("mmail").textContent=U.email||"Saved on this device";$("msync").textContent="";load();render();startSync()}
$("go").onclick=()=>{const n=$("nm").value.trim();if(!n){$("nm").focus();return}setUser({id:"l:"+n.toLowerCase(),name:n},true)};
$("nm").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("who").onclick=()=>{$("menu").hidden=!$("menu").hidden};
$("out").onclick=()=>{stopSync();if(FB)FB.Au.signOut(FB.auth).catch(()=>{});try{localStorage.removeItem(KEY+".user")}catch(e){}U=null;S.tasks=[];$("menu").hidden=true;$("gate").hidden=false;$("nm").value=""};
let sv=null;try{sv=JSON.parse(localStorage.getItem(KEY+".user"))}catch(e){}
(async()=>{let ok=false;try{ok=await initFirebase()}catch(e){toast("Cloud sync could not start. Using this device only.")}
  const local=sv&&sv.id&&sv.id.startsWith("l:");if(!FIREBASE_CONFIG)$("gnote").hidden=false;
  if(ok){googleBtn();FB.Au.onAuthStateChanged(FB.auth,u=>{
    if(u){if(U&&U.id==="g:"+u.uid)return;setUser({id:"g:"+u.uid,name:u.displayName||u.email,email:u.email,picture:u.photoURL},false)}
    else if(!(U&&U.id.startsWith("l:"))){U=null;$("gate").hidden=false}})}
  if(local)setUser(sv,false);else if(!ok)$("gate").hidden=false})();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
